name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'deploy-cpanel.sh'
      - 'deploy.php'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Backend
        working-directory: backend
        run: |
          npm ci
          DB_PROVIDER=mysql npx prisma generate --schema=prisma/schema.mysql.prisma
          npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=/api/v1 npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 177.136.229.136
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/conectovolt
            git pull origin master
            test -f backend/.env.production.local || { echo "Missing backend/.env.production.local on server"; exit 1; }
            cp backend/.env.production.local backend/.env
            cd backend
            npm ci --production
            DB_PROVIDER=mysql npx prisma generate --schema=prisma/schema.mysql.prisma
            npx prisma migrate deploy --schema=prisma/schema.mysql.prisma
            npm run build
            cd ../frontend
            npm ci
            NEXT_PUBLIC_API_URL=/api/v1 npm run build
            cd ..
            pm2 start ecosystem.config.js
            pm2 save
            pm2 startup 2>/dev/null || true

  mobile-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze
      - name: Build Android debug artifact
        working-directory: mobile
        run: flutter build apk --debug
